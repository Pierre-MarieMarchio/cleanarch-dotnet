# A tag, pushed or picked in Run pipeline, releases; a pipeline on a branch never does.
.release:
  rules:
    - if: $CI_COMMIT_TAG

# A tag does not skip the gate: every job below needs this one.
verify:
  extends:
    - .release
    - .dotnet
    - .docker
  stage: test
  timeout: 30 minutes
  script:
    - |
      dotnet restore "$SOLUTION"
      dotnet tool restore
    - dotnet cleanarch format --check
    - dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore
    # No coverage at release time: the floor gates a change, and this tag already passed it.
    - |
      dotnet test --solution "$SOLUTION" \
        --configuration "$CONFIGURATION" \
        --no-build
    - |
      set -o pipefail
      dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
      if grep -qi "has the following vulnerable packages" vulnerable.txt; then
        echo "Refusing to release with a known advisory."
        exit 1
      fi

# What a deployment runs against the database, built from the same commit as the image.
migration-bundle:
  extends:
    - .release
    - .dotnet
  stage: test
  needs: [verify]
  timeout: 20 minutes
  script:
    # Self-contained bundles with no connection string: run ./efbundle --connection as a principal with DDL rights, not the application's user.
    - dotnet tool restore
    # dotnet ef reads each project's restored assets before it builds anything.
    - dotnet restore "$SOLUTION"
    #if (localAuth)
    # One bundle per context: a release without this one leaves the identity schema absent.
    - |
      dotnet ef migrations bundle \
        --project src/Infrastructure/AT.Infrastructure.Auth \
        --startup-project src/Infrastructure/AT.Infrastructure.Auth \
        --configuration "$CONFIGURATION" \
        --self-contained \
        --target-runtime linux-x64 \
        --force \
        --output efbundle-identity
    #endif
    - |
      dotnet ef migrations bundle \
        --project src/Infrastructure/AT.Infrastructure.Persistence \
        --startup-project src/Infrastructure/AT.Infrastructure.Persistence \
        --configuration "$CONFIGURATION" \
        --self-contained \
        --target-runtime linux-x64 \
        --force \
        --output efbundle
    - |
      #if (localAuth)
      for bundle in efbundle-identity efbundle; do
      #else
      for bundle in efbundle; do
      #endif
        test -x "$bundle" || {
          echo "$bundle was not produced."
          exit 1
        }
      done
      #if (localAuth)
      ls -l efbundle-identity efbundle
      #else
      ls -l efbundle
      #endif
  artifacts:
    name: migration-bundle-$CI_COMMIT_TAG
    expire_in: 90 days
    paths:
      #if (localAuth)
      - efbundle-identity
      #endif
      - efbundle

# Each image signed with the pipeline's own identity, keyless, through Sigstore: cosign verify checks it against the project's URL and the tag.
container-image:
  extends:
    - .release
    - .docker
  image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
  stage: test
  needs: [verify]
  timeout: 30 minutes
  #if (api && jobsWorker)
  # Two images from one commit: the API, and the worker that runs the periodic jobs.
  #elseif (api)
  # One image, the API, which also runs the periodic jobs.
  #else
  # One image, the worker that runs the periodic jobs.
  #endif
  parallel:
    matrix:
      #if (api)
      - COMPONENT: api
        DOCKERFILE: src/Presentation/AT.Api/Dockerfile
      #endif
      #if (jobsWorker)
      - COMPONENT: worker
        DOCKERFILE: src/Presentation/AT.Worker/Dockerfile
      #endif
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # The binfmt image, pinned by digest and bumped by hand.
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all
    # Buildx takes the TLS endpoint of the Docker-in-Docker service from a context, not from the environment.
    - docker context create dind
    # The BuildKit image, pinned by digest and bumped like the binfmt image.
    - docker buildx create --name release --driver docker-container --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea --use dind
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    # Semantic versioning's tags: a prerelease gets its version alone and never moves latest.
    - |
      version="${CI_COMMIT_TAG#v}"
      if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
        echo "$CI_COMMIT_TAG is not v<major>.<minor>.<patch>[-<prerelease>], from which the image tags are made."
        exit 1
      fi
      major="${version%%.*}"
      minor="${version#*.}"
      minor="${minor%%.*}"
      image="$CI_REGISTRY_IMAGE/$COMPONENT"
      tags="$image:$version"
      case "$version" in *-*) ;; *) tags="$tags $image:$major.$minor $image:$major" ;; esac
      case "$CI_COMMIT_TAG" in *-*) ;; *) tags="$tags $image:latest" ;; esac
      tag_options=$(for tag in $tags; do printf ' --tag %s' "$tag"; done)
    # The SBOM scanner image, pinned and bumped like the two above; the licence label stays the Dockerfile's, since GitLab exposes none.
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --file "$DOCKERFILE" \
        --push \
        --sbom=generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
        --provenance=mode=max \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.description=$CI_PROJECT_DESCRIPTION" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.title=$CI_PROJECT_NAME" \
        --label "org.opencontainers.image.url=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.version=$version" \
        --metadata-file build-metadata.json \
        $tag_options \
        .
      digest=$(sed -n 's/^ *"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*$/\1/p' build-metadata.json)
      if [ -z "$digest" ]; then
        echo "The build reported no digest to sign."
        exit 1
      fi
    # cosign from its release, checked against its SHA-256: bump version and checksum together.
    - |
      cosign=v3.1.4
      cosign_sha256=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
      wget -q -O /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${cosign}/cosign-linux-amd64"
      echo "${cosign_sha256}  /usr/local/bin/cosign" | sha256sum -c -
      chmod 0755 /usr/local/bin/cosign
    # The index is signed, and with it the provenance and SBOM it carries.
    - cosign sign --yes "$image@$digest"
    - |
      echo "Image published: $image@$digest, for linux/amd64 and linux/arm64."
      echo "Tags: $tags"
      echo "Verify: cosign verify $image@$digest --certificate-identity $CI_PROJECT_URL//.gitlab-ci.yml@refs/tags/$CI_COMMIT_TAG --certificate-oidc-issuer $CI_SERVER_URL"
