version: 2

updates:
  # NuGet: every version lives in Directory.Packages.props.
  - package-ecosystem: nuget
    #if (templateMaintenance)
    target-branch: develop
    #endif
    directories:
      - /
      #if (templateMaintenance)
      # The newest .NET line's band, which only this project restores.
      - /.template.config/lines/net11.0
      #endif
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    # The packages and tools whose major is .NET's: a project stays on its .NET line, and moving to another is a migration.
    ignore:
      - dependency-name: Microsoft.AspNetCore.*
        update-types:
          - version-update:semver-major
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types:
          - version-update:semver-major
      - dependency-name: Microsoft.Extensions.*
        update-types:
          - version-update:semver-major
      - dependency-name: Asp.Versioning.*
        update-types:
          - version-update:semver-major
      #if (postgreSql)
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
        update-types:
          - version-update:semver-major
      - dependency-name: Npgsql.OpenTelemetry
        update-types:
          - version-update:semver-major
      #endif
      - dependency-name: dotnet-ef
        update-types:
          - version-update:semver-major
      - dependency-name: CleanArch.Cli
        update-types:
          - version-update:semver-major
      #if (templateMaintenance)
      # The newest line's tool manifest pins the project tool at the placeholder generation replaces.
      - dependency-name: CleanArch.Cli
      #endif
      # Roslyn moves by hand with Microsoft.EntityFrameworkCore.Design, which pins it exactly; alone, it fails to restore.
      - dependency-name: Microsoft.CodeAnalysis.CSharp

    groups:
      # The 10.0.x runtime band, one pull request per servicing release.
      microsoft-runtime:
        applies-to: version-updates
        patterns:
          - Microsoft.*
        exclude-patterns:
          - Microsoft.IdentityModel.*
          - Microsoft.Testing.*
          - Microsoft.Kiota.*
          - Microsoft.OpenApi.Kiota

      # The Kiota tool and the runtime its output is written for, in one pull request, which api-client regenerates against.
      kiota:
        applies-to: version-updates
        patterns:
          - Microsoft.Kiota.*
          - Microsoft.OpenApi.Kiota

      identity-model:
        applies-to: version-updates
        patterns:
          - Microsoft.IdentityModel.*

      test-tooling:
        applies-to: version-updates
        patterns:
          - Microsoft.Testing.*
          - xunit*
          - NSubstitute
          - Shouldly
          - NetArchTest.*
          - Testcontainers.*

      third-party-runtime:
        applies-to: version-updates
        patterns:
          - Asp.Versioning.*
          - FluentValidation*
          - MailKit
          #if (postgreSql)
          - Npgsql.*
          #endif
          - Scalar.*

      #if (postgreSql)
      # The OpenTelemetry 1.x band; Npgsql.OpenTelemetry stays with Npgsql.*.
      #else
      # The OpenTelemetry 1.x band.
      #endif
      observability:
        applies-to: version-updates
        patterns:
          - OpenTelemetry.*
      #if (aspire)

      # The Aspire band with the app host's SDK, which global.json pins under msbuild-sdks.
      aspire:
        applies-to: version-updates
        patterns:
          - Aspire.*
      #endif

  # GitHub Actions, pinned by SHA with the tag in a trailing comment.
  - package-ecosystem: github-actions
    #if (templateMaintenance)
    target-branch: develop
    #endif
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # Dockerfile base images; docker-compose.yml is its own ecosystem, below.
  - package-ecosystem: docker
    #if (templateMaintenance)
    target-branch: develop
    #endif
    directories:
      #if (api)
      - /src/Presentation/AT.Api
      #endif
      #if (jobsWorker)
      - /src/Presentation/AT.Worker
      #endif
      #if (sonar)
      # The analysis image, tools/sonar-scanner.Dockerfile, on the same SDK as the API's.
      - /tools
      #endif
      #if (anyWeb)
      # Every web app's image, nginx or Node, by directory glob.
      - /src/Web/apps/*
      #endif
      #if (templateMaintenance)
      # Each .NET line's images, which the starters and the GitLab pipeline include, and a project generated on the newest line takes in place of this checkout's; the pipeline's is in a file named as Helm values, the only YAML without a Kubernetes kind Dependabot reads an image: from.
      - /.template.config/images/net10.0
      - /.template.config/images/net11.0
      #endif
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    # The .NET images, whose name Dependabot reads without the registry, stay on the project's .NET line.
    ignore:
      - dependency-name: dotnet/*
        update-types:
          - version-update:semver-major
    groups:
      container-images:
        applies-to: version-updates
        patterns:
          - "*"

  #if (anyWeb)
  # The web workspace: the npm ecosystem reads src/Web/pnpm-lock.yaml for every app and package.
  - package-ecosystem: npm
    directory: /src/Web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      web-lint:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - globals
      web-api-client:
        applies-to: version-updates
        patterns:
          - openapi-fetch
          - openapi-typescript
      web-tooling:
        applies-to: version-updates
        patterns:
          - typescript
          - vitest
          - "@playwright/*"

  #endif
  #if (templateMaintenance && anyWeb)
    target-branch: develop
  #endif
  # docker-compose.yml's images, version updates only.
  - package-ecosystem: docker-compose
    #if (templateMaintenance)
    target-branch: develop
    #endif
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    # A .NET image a service names stays on the project's .NET line, as in the Dockerfiles.
    ignore:
      - dependency-name: dotnet/*
        update-types:
          - version-update:semver-major
    groups:
      compose-images:
        applies-to: version-updates
        patterns:
          - "*"
